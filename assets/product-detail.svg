<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F0FAFF"/>
      <stop offset="100%" style="stop-color:#E8F6FF"/>
    </linearGradient>
  </defs>

  <rect width="800" height="1000" fill="url(#bg)" rx="20"/>

  <!-- Detail callouts -->
  <g transform="translate(400, 450)">
    <!-- Bra outline -->
    <ellipse cx="-80" cy="0" rx="70" ry="80" fill="none" stroke="#4A9FD4" stroke-width="3" opacity="0.3"/>
    <ellipse cx="80" cy="0" rx="70" ry="80" fill="none" stroke="#4A9FD4" stroke-width="3" opacity="0.3"/>
    
    <!-- Detail 1: Wireless cups -->
    <circle cx="-80" cy="-30" r="30" fill="rgba(74,159,212,0.1)" stroke="#4A9FD4" stroke-width="2"/>
    <text x="-80" y="-25" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#4A9FD4" text-anchor="middle">WIRELESS</text>
    <text x="-80" y="-10" font-family="Inter, sans-serif" font-size="10" fill="#718096" text-anchor="middle">No underwire</text>
    <line x1="-80" y1="0" x2="-80" y2="50" stroke="#4A9FD4" stroke-width="1" stroke-dasharray="4,4"/>
    <circle cx="-80" cy="50" r="4" fill="#4A9FD4"/>
    
    <!-- Detail 2: Breathable mesh -->
    <circle cx="80" cy="-30" r="30" fill="rgba(255,140,105,0.1)" stroke="#FF8C69" stroke-width="2"/>
    <text x="80" y="-25" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#FF8C69" text-anchor="middle">MESH</text>
    <text x="80" y="-10" font-family="Inter, sans-serif" font-size="10" fill="#718096" text-anchor="middle">Breathable</text>
    <line x1="80" y1="0" x2="80" y2="50" stroke="#FF8C69" stroke-width="1" stroke-dasharray="4,4"/>
    <circle cx="80" cy="50" r="4" fill="#FF8C69"/>
    
    <!-- Detail 3: Adjustable straps -->
    <circle cx="0" cy="60" r="30" fill="rgba(72,187,120,0.1)" stroke="#48BB78" stroke-width="2"/>
    <text x="0" y="65" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#48BB78" text-anchor="middle">ADJUSTABLE</text>
    <text x="0" y="80" font-family="Inter, sans-serif" font-size="10" fill="#718096" text-anchor="middle">Custom fit</text>
    <line x1="0" y1="30" x2="0" y2="-30" stroke="#48BB78" stroke-width="1" stroke-dasharray="4,4"/>
    <circle cx="0" cy="-30" r="4" fill="#48BB78"/>
  </g>

  <!-- Title -->
  <text x="400" y="850" font-family="Georgia, serif" font-size="28" font-weight="600" fill="#2D3748" text-anchor="middle">
    Premium Details
  </text>
  <text x="400" y="880" font-family="Inter, sans-serif" font-size="16" fill="#718096" text-anchor="middle">
    Every feature designed for comfort & support
  </text>
</svg>