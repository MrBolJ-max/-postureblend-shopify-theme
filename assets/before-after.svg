<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F0FAFF"/>
      <stop offset="100%" style="stop-color:#E8F6FF"/>
    </linearGradient>
    <linearGradient id="good" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#48BB78"/>
      <stop offset="100%" style="stop-color:#68D391"/>
    </linearGradient>
    <linearGradient id="bad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B6B"/>
      <stop offset="100%" style="stop-color:#FC8181"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="600" fill="url(#bg)" rx="20"/>

  <!-- BEFORE side -->
  <g transform="translate(300, 300)">
    <text x="0" y="-220" font-family="Georgia, serif" font-size="28" font-weight="600" fill="#FF6B6B" text-anchor="middle">BEFORE</text>
    <text x="0" y="-190" font-family="Inter, sans-serif" font-size="16" fill="#718096" text-anchor="middle">Slouched posture, back pain</text>

    <!-- Figure - bad posture -->
    <ellipse cx="0" cy="80" rx="35" ry="45" fill="#FF6B6B" opacity="0.15"/>
    <circle cx="0" cy="-80" r="30" fill="#FF6B6B"/>
    
    <!-- Hunched back -->
    <path d="M-25 -50 Q-40 20 -25 80" stroke="#FC8181" stroke-width="12" fill="none" stroke-linecap="round"/>
    <path d="M25 -50 Q40 20 25 80" stroke="#FC8181" stroke-width="12" fill="none" stroke-linecap="round"/>
    
    <!-- Curved spine -->
    <path d="M0 -50 Q15 0 0 80" stroke="#FC8181" stroke-width="8" fill="none" stroke-linecap="round" opacity="0.5"/>
    
    <!-- Arms hanging -->
    <path d="M-30 -20 L-50 60" stroke="#FC8181" stroke-width="8" stroke-linecap="round"/>
    <path d="M30 -20 L50 60" stroke="#FC8181" stroke-width="8" stroke-linecap="round"/>
    
    <circle cx="0" cy="0" r="80" stroke="#FF6B6B" stroke-width="3" fill="none" stroke-dasharray="8,8" opacity="0.4"/>
  </g>

  <!-- AFTER side -->
  <g transform="translate(900, 300)">
    <text x="0" y="-220" font-family="Georgia, serif" font-size="28" font-weight="600" fill="#48BB78" text-anchor="middle">AFTER</text>
    <text x="0" y="-190" font-family="Inter, sans-serif" font-size="16" fill="#718096" text-anchor="middle">Upright posture, pain-free</text>

    <!-- Figure - good posture -->
    <ellipse cx="0" cy="80" rx="35" ry="45" fill="#48BB78" opacity="0.15"/>
    <circle cx="0" cy="-80" r="30" fill="#48BB78"/>
    
    <!-- Straight back -->
    <path d="M-25 -50 L-25 80" stroke="#68D391" stroke-width="12" fill="none" stroke-linecap="round"/>
    <path d="M25 -50 L25 80" stroke="#68D391" stroke-width="12" fill="none" stroke-linecap="round"/>
    
    <!-- Straight spine -->
    <path d="M0 -50 L0 80" stroke="#68D391" stroke-width="8" fill="none" stroke-linecap="round" opacity="0.5"/>
    
    <!-- Arms aligned -->
    <path d="M-30 -20 L-45 40" stroke="#68D391" stroke-width="8" stroke-linecap="round"/>
    <path d="M30 -20 L45 40" stroke="#68D391" stroke-width="8" stroke-linecap="round"/>
    
    <!-- Stars -->
    <text x="0" y="160" font-size="24" text-anchor="middle" fill="#FF8C69">★ ★ ★ ★ ★</text>
    
    <circle cx="0" cy="0" r="80" stroke="#48BB78" stroke-width="3" fill="none" stroke-dasharray="8,8" opacity="0.4"/>
  </g>

  <!-- VS badge -->
  <g transform="translate(600, 300)">
    <circle r="40" fill="#4A9FD4"/>
    <text x="0" y="10" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#FFF" text-anchor="middle">VS</text>
  </g>

  <!-- Bottom banner -->
  <rect x="200" y="500" width="800" height="60" rx="30" fill="#4A9FD4" opacity="0.1"/>
  <text x="600" y="540" font-family="Inter, sans-serif" font-size="18" font-weight="600" fill="#4A9FD4" text-anchor="middle">Results in just 2 weeks of daily wear</text>
</svg>
