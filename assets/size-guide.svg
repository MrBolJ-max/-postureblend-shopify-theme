<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F0FAFF"/>
      <stop offset="100%" style="stop-color:#E8F6FF"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#bg)" rx="20"/>

  <!-- Title -->
  <text x="400" y="60" font-family="Georgia, serif" font-size="32" font-weight="600" fill="#2D3748" text-anchor="middle">Size Guide</text>
  <text x="400" y="90" font-family="Inter, sans-serif" font-size="16" fill="#718096" text-anchor="middle">Measure around your band and bust to find your fit</text>

  <!-- Measurement diagram -->
  <g transform="translate(250, 280)">
    <!-- Stylized torso -->
    <ellipse cx="0" cy="0" rx="60" ry="100" fill="#4A9FD4" opacity="0.2"/>
    <ellipse cx="0" cy="-30" rx="50" ry="55" fill="#4A9FD4" opacity="0.15"/>

    <!-- Band measurement line -->
    <line x1="-80" y1="20" x2="80" y2="20" stroke="#FF8C69" stroke-width="4" stroke-linecap="round"/>
    <text x="0" y="55" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#FF8C69" text-anchor="middle">Band (under bust)</text>

    <!-- Bust measurement line -->
    <line x1="-90" y1="-50" x2="90" y2="-50" stroke="#4A9FD4" stroke-width="4" stroke-linecap="round" stroke-dasharray="8,4"/>
    <text x="0" y="-75" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#4A9FD4" text-anchor="middle">Bust (fullest part)</text>
  </g>

  <!-- Size chart -->
  <g transform="translate(550, 200)">
    <rect x="-130" y="0" width="260" height="40" rx="8" fill="#4A9FD4"/>
    <text x="0" y="26" font-family="Inter, sans-serif" font-size="16" font-weight="700" fill="#FFF" text-anchor="middle">SIZE CHART</text>

    <!-- Chart rows -->
    <rect x="-130" y="50" width="260" height="36" rx="4" fill="rgba(74,159,212,0.08)"/>
    <text x="-80" y="74" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#4A9FD4" text-anchor="middle">Size</text>
    <text x="0" y="74" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#4A9FD4" text-anchor="middle">Band</text>
    <text x="80" y="74" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#4A9FD4" text-anchor="middle">Bust</text>

    <rect x="-130" y="90" width="260" height="36" rx="4" fill="white"/>
    <text x="-80" y="114" font-family="Inter, sans-serif" font-size="14" fill="#718096" text-anchor="middle">S</text>
    <text x="0" y="114" font-family="Inter, sans-serif" font-size="14" fill="#718096" text-anchor="middle">28-30"</text>
    <text x="80" y="114" font-family="Inter, sans-serif" font-size="14" fill="#718096" text-anchor="middle">32-34"</text>

    <rect x="-130" y="130" width="260" height="36" rx="4" fill="rgba(74,159,212,0.04)"/>
    <text x="-80" y="154" font-family="Inter, sans-serif" font-size="14" fill="#718096" text-anchor="middle">M</text>
    <text x="0" y="154" font-family="Inter, sans-serif" font-size="14" fill="#718096" text-anchor="middle">32-34"</text>
    <text x="80" y="154" font-family="Inter, sans-serif" font-size="14" fill="#718096" text-anchor="middle">36-38"</text>

    <rect x="-130" y="170" width="260" height="36" rx="4" fill="white"/>
    <text x="-80" y="194" font-family="Inter, sans-serif" font-size="14" fill="#718096" text-anchor="middle">L</text>
    <text x="0" y="194" font-family="Inter, sans-serif" font-size="14" fill="#718096" text-anchor="middle">36-38"</text>
    <text x="80" y="194" font-family="Inter, sans-serif" font-size="14" fill="#718096" text-anchor="middle">40-42"</text>

    <rect x="-130" y="210" width="260" height="36" rx="4" fill="rgba(74,159,212,0.04)"/>
    <text x="-80" y="234" font-family="Inter, sans-serif" font-size="14" fill="#718096" text-anchor="middle">XL</text>
    <text x="0" y="234" font-family="Inter, sans-serif" font-size="14" fill="#718096" text-anchor="middle">40-42"</text>
    <text x="80" y="234" font-family="Inter, sans-serif" font-size="14" fill="#718096" text-anchor="middle">44-46"</text>

    <rect x="-130" y="250" width="260" height="36" rx="4" fill="white"/>
    <text x="-80" y="274" font-family="Inter, sans-serif" font-size="14" fill="#718096" text-anchor="middle">XXL</text>
    <text x="0" y="274" font-family="Inter, sans-serif" font-size="14" fill="#718096" text-anchor="middle">44-46"</text>
    <text x="80" y="274" font-family="Inter, sans-serif" font-size="14" fill="#718096" text-anchor="middle">48-50"</text>
  </g>

  <text x="400" y="560" font-family="Inter, sans-serif" font-size="14" fill="#718096" text-anchor="middle">💡 Tip: If between sizes, size up for comfort</text>
</svg>
