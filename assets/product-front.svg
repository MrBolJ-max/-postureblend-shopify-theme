<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F0FAFF"/>
      <stop offset="100%" style="stop-color:#E8F6FF"/>
    </linearGradient>
    <linearGradient id="braGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4A9FD4"/>
      <stop offset="50%" style="stop-color:#6BBFED"/>
      <stop offset="100%" style="stop-color:#4A9FD4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="30" flood-color="#4A9FD4" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="800" height="1000" fill="url(#bg)" rx="20"/>

  <!-- Bra front view -->
  <g filter="url(#shadow)" transform="translate(400, 450)">
    <!-- Left cup -->
    <ellipse cx="-85" cy="0" rx="80" ry="90" fill="url(#braGrad)"/>
    <ellipse cx="-85" cy="0" rx="70" ry="80" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
    
    <!-- Right cup -->
    <ellipse cx="85" cy="0" rx="80" ry="90" fill="url(#braGrad)"/>
    <ellipse cx="85" cy="0" rx="70" ry="80" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
    
    <!-- Center gore -->
    <path d="M-20 -25 Q0 -35 20 -25 L15 40 Q0 50 -15 40 Z" fill="#2D3748"/>
    
    <!-- Straps -->
    <path d="M-85 -90 L-85 -220" stroke="url(#braGrad)" stroke-width="24" stroke-linecap="round"/>
    <path d="M85 -90 L85 -220" stroke="url(#braGrad)" stroke-width="24" stroke-linecap="round"/>
    
    <!-- Band -->
    <path d="M-170 85 Q0 125 170 85" stroke="url(#braGrad)" stroke-width="38" fill="none" stroke-linecap="round"/>
    
    <!-- Decorative lines - wireless detail -->
    <path d="M-135 -15 Q-85 15 -35 -15" stroke="rgba(255,255,255,0.25)" stroke-width="2" fill="none"/>
    <path d="M35 -15 Q85 15 135 -15" stroke="rgba(255,255,255,0.25)" stroke-width="2" fill="none"/>
    
    <!-- Mesh texture indication -->
    <circle cx="-85" cy="20" r="3" fill="rgba(255,255,255,0.4)"/>
    <circle cx="-65" cy="40" r="3" fill="rgba(255,255,255,0.4)"/>
    <circle cx="-105" cy="40" r="3" fill="rgba(255,255,255,0.4)"/>
    <circle cx="85" cy="20" r="3" fill="rgba(255,255,255,0.4)"/>
    <circle cx="65" cy="40" r="3" fill="rgba(255,255,255,0.4)"/>
    <circle cx="105" cy="40" r="3" fill="rgba(255,255,255,0.4)"/>
  </g>

  <!-- Label -->
  <text x="400" y="820" font-family="Georgia, serif" font-size="32" font-weight="600" fill="#2D3748" text-anchor="middle">
    FallSweet Wireless
  </text>
  <text x="400" y="860" font-family="Inter, sans-serif" font-size="20" fill="#718096" text-anchor="middle">
    Posture Correction Bra
  </text>

  <!-- Badge -->
  <g transform="translate(400, 920)">
    <rect x="-130" y="-20" width="260" height="40" rx="20" fill="rgba(255,140,105,0.15)" stroke="#FF8C69" stroke-width="1"/>
    <text x="0" y="8" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#FF8C69" text-anchor="middle">
      PREMIUM SUPPORT DESIGN
    </text>
  </g>
</svg>